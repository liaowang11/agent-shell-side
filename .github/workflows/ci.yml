name: CI

# Pushes only build on `main'.  Work on a branch is covered by its pull
# request, so without this bound every branch push would build twice.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - LICENSE
  pull_request:
    paths-ignore:
      - '**.md'
      - LICENSE

# One live run per branch or pull request.  Pushing again supersedes the
# run still going for the same ref, so a burst of commits costs one build
# rather than one per commit.  Runs on `main' are left to finish: they are
# the record that a released commit was green, and cancelling one would
# leave a gap no later run fills.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The job only reads the checkout.  Nothing here writes to the repository,
# comments, or publishes, so the token gets no other scope.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # The suite runs in well under a second; the rest is provisioning
    # Emacs.  This is a stop for a hang, not a target to tune against.
    timeout-minutes: 10
    strategy:
      matrix:
        # `Package-Requires' names 30.1 as the floor.  Kept to one version
        # on purpose: each entry added here is another full build per push.
        emacs-version: ['30.1']
    steps:
      # Both actions are pinned to a release rather than a branch: `master'
      # moves under us, and an action that changes without a version bump
      # turns a green build into an unreproducible one.
      - uses: actions/checkout@v7
      - uses: purcell/setup-emacs@v8.0
        with:
          version: ${{ matrix.emacs-version }}
      - name: Byte compile
        run: make compile
      - name: Run tests
        run: make test
